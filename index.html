<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LireMonde</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">LireMonde</div>
    <ul class="nav-links">
      <li><a href="#"></a>Accueil</li>
      <li><a href="#"></a>À Lire</li>
      <li><a href="#"></a>Admin</li>
    </ul>
 <input type="text"  class="search-input" placeholder="Rechercher un livre... ">
</header>
  <!-- HERO SECTION -->
 <section id="Accueil" class="hero">
        <img src="images/plr.jpg" alt="LireMonde">
        <div class="hero-content">
            <h1>Découvrez vos prochains livres préférés</h1>
            <p>Explorez notre bibliothèque interactive.</p>
        </div>
</section>
<main>
       <!-- FILTER BUTTONS -->
<div id="filters-wrapper">
    <section class="filters-container">
        <button onclick="filterBooks('Tous')">Tous</button>
        <button onclick="filterBooks('Classique')">Classique</button>
        <button onclick="filterBooks('Drame')">Drame</button>
        <button onclick="filterBooks('Fantaisie')">Fantaisie</button>
        <button onclick="filterBooks('Comédie')">Comédie</button>
    </section>
</div>
 <!-- BOOKS SECTION -->
    <section id="livres" class="books-container">
        <h2 class="section-title">Livres populaires</h2>
    </section>

    <div class="book-grid" id="book-container"></div>

    <!-- FAVORITES -->
    <section id="Favoris" class="favorites">
        <h2 class="section-title">Ma Liste À Lire ❤️</h2>

        <div class="book-grid" id="book-grid-fav"></div>
    </section>
    <!-- MODAL -->
    <div id="modal" class="modal">

        <div class="modal-content">
            <span id="close">&times;</span>
            <img id="modal-img" src="" alt="">
            <h2 id="modal-titre"></h2>
            <p id="modal-genre"></p>
            <p id="modal-description"></p>
           <button class="btn fav-btn" id="add-fav">À Lire ❤️</button>
        </div>
    </div>

</main>
<!-- FOOTER -->
    <footer>
    <p>© 2026 LireMonde - Plateforme de lecture numérique</p>
</footer>
<script src="script.js"></script>
</body>
</html>
